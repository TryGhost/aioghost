name: Weekly Release

on:
  schedule:
    # Every Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Need full history for tags
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: latest_tag
        shell: bash
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [[ -z "$LATEST_TAG" ]]; then
            echo "tag=v0.0.0" >> $GITHUB_OUTPUT
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "No existing release tag"
            exit 0
          fi

          if [[ ! "$LATEST_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Latest tag must use vMAJOR.MINOR.PATCH format: $LATEST_TAG" >&2
            exit 1
          fi

          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "tag_exists=true" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Check for changes since last tag
        id: changes
        env:
          LATEST_TAG: ${{ steps.latest_tag.outputs.tag }}
          TAG_EXISTS: ${{ steps.latest_tag.outputs.tag_exists }}
        run: |
          if [ "$TAG_EXISTS" = "true" ]; then
            COMMITS=$(git rev-list "${LATEST_TAG}..HEAD" --count)
          else
            COMMITS=$(git rev-list HEAD --count)
          fi

          echo "commits=$COMMITS" >> $GITHUB_OUTPUT
          echo "Commits since $LATEST_TAG: $COMMITS"
          
          if [ "$COMMITS" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        if: steps.changes.outputs.has_changes == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"

      - name: Check lockfile
        if: steps.changes.outputs.has_changes == 'true'
        run: uv lock --check

      - name: Install dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        if: steps.changes.outputs.has_changes == 'true'
        id: tests
        run: |
          uv run pytest --cov=src/aioghost --cov-fail-under=95
          echo "passed=true" >> $GITHUB_OUTPUT

      - name: Calculate next version
        if: steps.changes.outputs.has_changes == 'true' && steps.tests.outputs.passed == 'true'
        id: version
        shell: bash
        env:
          LATEST_TAG: ${{ steps.latest_tag.outputs.tag }}
        run: |
          if [[ ! "$LATEST_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Latest tag must use vMAJOR.MINOR.PATCH format: $LATEST_TAG" >&2
            exit 1
          fi

          # Remove 'v' prefix
          VERSION=${LATEST_TAG#v}
          
          # Split into major.minor.patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Increment patch
          PATCH=$((10#$PATCH + 1))
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update version and lockfile
        if: steps.changes.outputs.has_changes == 'true' && steps.tests.outputs.passed == 'true'
        shell: bash
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [[ ! "$NEW_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "New version must use MAJOR.MINOR.PATCH format: $NEW_VERSION" >&2
            exit 1
          fi

          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml
          uv lock
          uv lock --check

      - name: Commit and tag
        if: steps.changes.outputs.has_changes == 'true' && steps.tests.outputs.passed == 'true'
        shell: bash
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [[ ! "$NEW_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "New version must use MAJOR.MINOR.PATCH format: $NEW_VERSION" >&2
            exit 1
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add pyproject.toml uv.lock
          git commit -m "Release v${NEW_VERSION}"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          
          git push origin main
          git push origin "v${NEW_VERSION}"

      - name: Build package
        if: steps.changes.outputs.has_changes == 'true' && steps.tests.outputs.passed == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.changes.outputs.has_changes == 'true' && steps.tests.outputs.passed == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      - name: Summary
        env:
          HAS_CHANGES: ${{ steps.changes.outputs.has_changes }}
          LATEST_TAG: ${{ steps.latest_tag.outputs.tag }}
          TESTS_PASSED: ${{ steps.tests.outputs.passed }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [ "$HAS_CHANGES" != "true" ]; then
            echo "### No Release Needed" >> $GITHUB_STEP_SUMMARY
            echo "No changes since $LATEST_TAG" >> $GITHUB_STEP_SUMMARY
          elif [ "$TESTS_PASSED" = "true" ]; then
            echo "### Released v$NEW_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "Published to PyPI" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Release Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Tests failed" >> $GITHUB_STEP_SUMMARY
          fi
